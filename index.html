<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kartu Ujian Pro - Modern</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #10b981;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* Panel Pengaturan Elegan */
        .no-print { 
            background: #ffffff; 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        h2 { 
            font-weight: 700; 
            color: var(--primary); 
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-panel { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 30px; 
        }

        .input-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
        }

        label { 
            display: block; 
            font-weight: 600; 
            font-size: 13px; 
            margin-bottom: 8px; 
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="file"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            background: white;
            font-size: 14px;
            transition: all 0.3s;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-print { 
            background: var(--primary); 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            width: 100%;
            font-size: 16px;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-print:hover { background: var(--primary-light); transform: translateY(-2px); }

        /* Desain Kartu Sesuai image_e0fc0e.png */
        #print-area { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            padding: 20px;
            justify-items: center;
        }

        .card { 
            width: 12.5cm; 
            height: 8.2cm; 
            border: 2px solid #000; 
            background: #fff; 
            padding: 15px; 
            position: relative; 
            box-sizing: border-box; 
            page-break-inside: avoid;
        }

        .header { 
            display: flex; 
            align-items: center; 
            border-bottom: 3px double #000; 
            padding-bottom: 8px; 
            margin-bottom: 12px; 
        }

        .logo-img { width: 60px; height: 60px; object-fit: contain; }
        .header-text { 
            flex-grow: 1; 
            font-weight: 800; 
            text-transform: uppercase; 
            font-size: 13px; 
            text-align: center;
            line-height: 1.3;
        }

        .ruang-tag { 
            position: absolute; 
            top: 85px; 
            right: 20px; 
            border: 1.5px solid #000; 
            padding: 2px 10px; 
            font-weight: 700; 
            font-size: 14px;
        }

        .content { display: flex; gap: 20px; margin-top: 10px; }
        .photo-box { 
            width: 3cm; 
            height: 4cm; 
            border: 1px solid #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #f8fafc; 
            font-size: 10px; 
            text-align: center;
        }

        .details table { font-size: 13px; border-collapse: collapse; width: 100%; }
        .details td { padding: 4px 0; vertical-align: top; }
        .val { font-weight: 600; padding-left: 5px; }

        .footer { 
            position: absolute; 
            bottom: 15px; 
            right: 20px; 
            text-align: center; 
            font-size: 12px; 
            width: 220px; 
        }

        .ttd-img { 
            height: 55px; 
            position: absolute; 
            left: 50%; 
            transform: translateX(-50%); 
            bottom: 30px; 
            z-index: 1;
            mix-blend-mode: multiply;
        }

        @media print { 
            body { background: white; }
            .no-print { display: none; } 
            #print-area { padding: 0; display: block; }
            .card { margin-bottom: 10px; margin-left: auto; margin-right: auto; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h2>⚙️ Dashboard Pengaturan Kartu</h2>
    
    <div class="grid-panel">
        <div class="input-card">
            <label>🖼️ Identitas Visual</label>
            <span style="font-size: 11px; color: #64748b;">Logo Kiri:</span>
            <input type="file" onchange="previewImg(event, 'l-img')">
            <span style="font-size: 11px; color: #64748b;">Logo Kanan:</span>
            <input type="file" onchange="previewImg(event, 'r-img')">
            
            <label>🏫 Nama Sekolah & Tahun</label>
            <input type="text" id="sch_name" value="SMAN 1 PRINGGARATA TP. 2025/2026" oninput="renderCards()">
        </div>

        <div class="input-card">
            <label>🖋️ Otoritas (Kepala Sekolah)</label>
            <span style="font-size: 11px; color: #64748b;">Upload Tanda Tangan:</span>
            <input type="file" onchange="previewImg(event, 't-img')">
            
            <label>Nama Kepala Sekolah</label>
            <input type="text" id="ks_name" value="H. IWAN RIAMAN, S.Pd., M.Pd." oninput="renderCards()">
            <label>NIP</label>
            <input type="text" id="ks_nip" value="NIP. 19711231 199702 1 014" oninput="renderCards()">
        </div>
    </div>

    <div class="input-card" style="margin-top: 20px; background: #ecfdf5; border-color: #a7f3d0;">
        <label style="color: #065f46;">📊 Database Siswa (Excel)</label>
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
        <p style="font-size: 11px; margin: 0; color: #065f46;">Pastikan kolom: Nama, NoPeserta, NIS, TTL, Program, Ruang</p>
    </div>

    <button class="btn-print" onclick="window.print()">🚀 Cetak Kartu Peserta</button>
</div>

<div id="print-area"></div>

<script>
    let studentData = [];
    let imgs = { logoL: '', logoR: '', ttd: '' };

    function previewImg(e, type) {
        const reader = new FileReader();
        reader.onload = () => {
            if(type === 'l-img') imgs.logoL = reader.result;
            if(type === 'r-img') imgs.logoR = reader.result;
            if(type === 't-img') imgs.ttd = reader.result;
            renderCards();
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            studentData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            renderCards();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function renderCards() {
        const area = document.getElementById('print-area');
        const sch = document.getElementById('sch_name').value;
        const ks = document.getElementById('ks_name').value;
        const nip = document.getElementById('ks_nip').value;
        area.innerHTML = '';

        studentData.forEach(s => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="header">
                    <img src="${imgs.logoL}" class="logo-img" style="${!imgs.logoL?'visibility:hidden':''}">
                    <div class="header-text">KARTU PESERTA UJIAN SEKOLAH<br>${sch}</div>
                    <img src="${imgs.logoR}" class="logo-img" style="${!imgs.logoR?'visibility:hidden':''}">
                </div>
                <div class="ruang-tag">&lt;${s.Ruang || 'Ruang 1'}&gt;</div>
                <div class="content">
                    <div class="photo-box">PAS FOTO<br>3 x 4</div>
                    <div class="details">
                        <table>
                            <tr><td width="110">No. Peserta</td><td>: <span class="val">${s.NoPeserta || '-'}</span></td></tr>
                            <tr><td>Nama Peserta</td><td>: <span class="val" style="text-transform:uppercase">${s.Nama || '-'}</span></td></tr>
                            <tr><td>NIS</td><td>: <span class="val">${s.NIS || '-'}</span></td></tr>
                            <tr><td>Tempat, Tgl Lahir</td><td>: <span class="val">${s.TTL || '-'}</span></td></tr>
                            <tr><td>Program Studi</td><td>: <span class="val">${s.Program || '-'}</span></td></tr>
                        </table>
                    </div>
                </div>
                <div class="footer">
                    Pringgarata, ${new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}<br>
                    Kepala Sekolah,
                    ${imgs.ttd ? `<img src="${imgs.ttd}" class="ttd-img">` : '<div style="height:55px"></div>'}
                    <div style="margin-top:40px"><b>${ks}</b></div>
                    ${nip}
                </div>
            `;
            area.appendChild(card);
        });
    }
</script>

</body>
</html>
