<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kartu Ujian V3 - Premium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --secondary: #64748b; --success: #10b981; --dark: #0f172a; --card-bg: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: var(--dark); }
        
        .app-container { max-width: 1100px; margin: 0 auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); }
        header { text-align: center; margin-bottom: 32px; }
        header h1 { font-weight: 800; font-size: 28px; color: var(--primary); letter-spacing: -0.5px; margin: 0; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card-panel { background: #fdfdfd; border: 1px solid #f1f5f9; padding: 24px; border-radius: 20px; }
        .full-width { grid-column: span 2; }
        
        h3 { font-size: 14px; color: var(--secondary); text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        /* Input Styling */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--secondary); }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 14px; box-sizing: border-box; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        /* Button Modern */
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; border: none; gap: 8px; }
        .btn-excel { background: #ecfdf5; color: var(--success); width: 100%; border: 1px dashed var(--success); }
        .btn-excel:hover { background: var(--success); color: white; }
        .btn-add { background: var(--primary); color: white; width: 100%; margin-top: 10px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3); }
        .btn-print { background: var(--dark); color: white; width: 100%; padding: 18px; font-size: 16px; margin-top: 24px; }

        /* Kartu Peserta Styles */
        #print-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 40px; justify-content: center; }
        .card { 
            width: 9.5cm; height: 6.8cm; border: 1.5px solid #000; padding: 15px; position: relative; 
            box-sizing: border-box; background: linear-gradient(180deg, #fff 65%, #eff6ff 100%); overflow: hidden; 
        }
        .photo-space { width: 2.1cm; height: 2.8cm; border: 1px solid #000; margin-top: 12px; display: flex; align-items: center; justify-content: center; font-size: 9px; background: #fff; }

        @media print { .app-container { display: none; } #print-area { margin: 0; } .card { -webkit-print-color-adjust: exact; } }
    </style>
</head>
<body>

<div class="app-container">
    <header><h1>APLIKASI GENERATE KARTU</h1></header>

    <div class="main-grid">
        <!-- Panel 1: Import & Sekolah -->
        <div class="card-panel">
            <h3>📂 Sumber Data</h3>
            <div class="form-group">
                <button class="btn btn-excel" onclick="dlTpl()">📥 Download Template Excel</button>
            </div>
            <div class="form-group">
                <label>Upload File Excel</label>
                <input type="file" id="fileIn" accept=".xlsx, .xls">
            </div>
            <div class="form-group">
                <label>Nama Sekolah / Instansi</label>
                <input type="text" id="sch_name" value="SDN 1 LINGGA PURA TP. 2025/2026" oninput="render()">
            </div>
        </div>

        <!-- Panel 2: Pengesahan -->
        <div class="card-panel">
            <h3>🛡️ Pengesahan</h3>
            <div class="main-grid" style="grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group"><label>Nama Kepala Sekolah</label><input type="text" id="ks_name" value="ROSYIDIN, S.Pd" oninput="render()"></div>
                <div class="form-group"><label>NIP</label><input type="text" id="ks_nip" value="NIP. 19700605 201410 1 003" oninput="render()"></div>
            </div>
            <div class="main-grid" style="grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group"><label>Stempel</label><input type="file" onchange="prev(event, 's')"></div>
                <div class="form-group"><label>TTD</label><input type="file" onchange="prev(event, 't')"></div>
            </div>
        </div>

        <!-- Panel 3: Input Manual (FITUR BARU) -->
        <div class="card-panel full-width">
            <h3>✍️ Input Data Siswa Manual</h3>
            <div class="main-grid" style="grid-template-columns: repeat(4, 1fr); gap: 10px;">
                <input type="text" id="m_nama" placeholder="Nama Lengkap">
                <input type="text" id="m_no" placeholder="No. Peserta">
                <input type="text" id="m_ttl" placeholder="Tempat, Tgl Lahir">
                <input type="text" id="m_ruang" placeholder="Ruang">
            </div>
            <button class="btn btn-add" onclick="addManual()">➕ Tambahkan Siswa ke List</button>
        </div>
    </div>

    <button class="btn btn-print" onclick="window.print()">🔥 CETAK SEMUA KARTU</button>
</div>

<div id="print-area"></div>

<script>
    let dataSiswa = [];
    let img = { t: '', s: '' };

    function dlTpl() {
        const header = [["Nama", "TTL", "NoPeserta", "Ruang"]];
        const ws = XLSX.utils.aoa_to_sheet(header);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, "Template_Kartu.xlsx");
    }

    function addManual() {
        const n = document.getElementById('m_nama').value;
        const no = document.getElementById('m_no').value;
        const t = document.getElementById('m_ttl').value;
        const r = document.getElementById('m_ruang').value;
        
        if(!n || !no) return alert("Nama dan No Peserta wajib diisi!");
        
        dataSiswa.push({ Nama: n, NoPeserta: no, TTL: t, Ruang: r });
        render();
        // Clear input
        ['m_nama', 'm_no', 'm_ttl', 'm_ruang'].forEach(id => document.getElementById(id).value = '');
    }

    function prev(e, k) {
        const reader = new FileReader();
        reader.onload = () => { img[k] = reader.result; render(); };
        reader.readAsDataURL(e.target.files[0]);
    }

    document.getElementById('fileIn').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            dataSiswa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            render();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function render() {
        const area = document.getElementById('print-area');
        area.innerHTML = '';
        const sch = document.getElementById('sch_name').value;
        const ks = document.getElementById('ks_name').value;
        const nip = document.getElementById('ks_nip').value;

        dataSiswa.forEach(s => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:12px;">
                    <b style="font-size:11px;">KARTU PESERTA UJIAN SEKOLAH<br>${sch}</b>
                </div>
                <div style="position:absolute; top:65px; right:15px; border:1.5px solid #000; padding:2px 10px; font-weight:800; font-size:14px; background:#fff;">RUANG: ${s.Ruang || '-'}</div>
                <table style="font-size:11px; width:70%; border-collapse:collapse;">
                    <tr height="20"><td>No. Peserta</td><td>: <b>${s.NoPeserta || '-'}</b></td></tr>
                    <tr height="20"><td>Nama</td><td>: <b style="text-transform:uppercase">${s.Nama || '-'}</b></td></tr>
                    <tr height="20"><td>TTL</td><td>: <b>${s.TTL || '-'}</b></td></tr>
                </table>
                <div class="photo-space">PAS FOTO 3x4</div>
                
                <div style="position:absolute; bottom:25px; right:15px; text-align:center; font-size:10px; width:160px;">
                    Lingga Pura, 18 Mei 2026<br>Kepala Sekolah,
                    <div style="position:relative; height:50px;">
                        ${img.s ? `<img src="${img.s}" style="position:absolute; height:65px; left:10px; top:-5px; opacity:0.8; mix-blend-mode:multiply;">` : ''}
                        ${img.t ? `<img src="${img.t}" style="position:absolute; height:45px; left:40px; top:0; mix-blend-mode:multiply;">` : ''}
                    </div>
                    <b>${ks}</b><br>${nip}
                </div>
            `;
            area.appendChild(div);
        });
    }
</script>
</body>
</html>
