<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kartu Ujian Pro - Modern Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --success: #10b981; --dark: #0f172a; --slate: #64748b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: var(--dark); }
        
        /* DASHBOARD LAYOUT */
        .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 24px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.04); }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-weight: 800; font-size: 26px; color: var(--primary); margin: 0; }
        
        .grid-config { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .panel { background: #fdfdfd; border: 1px solid #f1f5f9; padding: 24px; border-radius: 20px; }
        .full { grid-column: span 2; }
        
        h3 { font-size: 13px; color: var(--slate); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        
        /* BUTTONS & INPUTS */
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; border: none; gap: 10px; text-decoration: none; }
        .btn-template { background: #ecfdf5; color: var(--success); width: 100%; border: 1.5px dashed var(--success); margin-bottom: 15px; }
        .btn-template:hover { background: var(--success); color: white; }
        .btn-print { background: var(--dark); color: white; width: 100%; padding: 18px; font-size: 16px; margin-top: 25px; border-radius: 15px; }
        .btn-add { background: var(--primary); color: white; width: 100%; }

        label { display: block; font-size: 12px; font-weight: 700; color: var(--slate); margin-bottom: 6px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; }

        /* CUSTOM UPLOAD BOX */
        .upload-box { position: relative; height: 45px; margin-bottom: 15px; }
        .upload-box input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
        .upload-ui { position: absolute; top:0; left:0; width: 100%; height: 100%; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 12px; display: flex; align-items: center; padding: 0 15px; font-size: 13px; font-weight: 600; color: var(--slate); box-sizing: border-box; }
        .upload-box:hover .upload-ui { border-color: var(--primary); color: var(--primary); }

        /* HASIL KARTU (FIXED LAYOUT) */
        #print-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10mm; margin-top: 40px; }
        .card { 
            width: 9.5cm; height: 6.8cm; border: 2px solid #000; padding: 10px; position: relative; 
            box-sizing: border-box; background: linear-gradient(180deg, #fff 70%, #dbeafe 100%); overflow: hidden; page-break-inside: avoid;
        }
        .card-header { display: flex; align-items: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px; height: 55px; }
        .logo-img { width: 45px; height: 45px; object-fit: contain; }
        .header-title { text-align: center; flex: 1; font-weight: 800; font-size: 10px; line-height: 1.3; }
        
        .tag-ruang { position: absolute; top: 72px; right: 10px; border: 2px solid #000; padding: 2px 10px; font-weight: 800; font-size: 14px; background: #fff; }
        
        .card-body { width: 100%; }
        .data-table { font-size: 11px; border-collapse: collapse; margin-bottom: 10px; }
        .data-table td { padding: 3px 0; vertical-align: top; }
        
        .photo-area { width: 2.1cm; height: 2.8cm; border: 1.5px solid #000; display: flex; align-items: center; justify-content: center; font-size: 8px; background: #fff; font-weight: 800; position: relative; }
        
        /* NOTE DI BAWAH FOTO (PALING KIRI) */
        .note-box { width: 2.1cm; margin-top: 5px; font-size: 6.5px; font-style: italic; font-weight: 700; line-height: 1.1; color: #000; text-align: center; }

        .footer-sign { position: absolute; bottom: 20px; right: 10px; text-align: center; width: 170px; }
        .sign-wrap { position: relative; height: 50px; margin: 3px 0; }
        .img-stamp { position: absolute; height: 65px; left: 10px; top: -10px; opacity: 0.8; mix-blend-mode: multiply; z-index: 1; }
        .img-ttd { position: absolute; height: 45px; left: 45px; top: 0; mix-blend-mode: multiply; z-index: 2; }

        @media print { .container { display: none; } .card { -webkit-print-color-adjust: exact; } }
    </style>
</head>
<body>

<div class="container">
    <header><h1>APLIKASI GENERATOR KARTU</h1></header>
    
    <div class="grid-config">
        <!-- PANEL DATA & EXCEL -->
        <div class="panel">
            <h3>📊 Sumber Data (Excel)</h3>
            <button class="btn btn-template" onclick="dlTpl()">📥 Download Template Excel</button>
            <label>Upload Data Siswa</label>
            <div class="upload-box">
                <input type="file" id="fileIn" accept=".xlsx, .xls">
                <div class="upload-ui" id="txtFileIn">Pilih file excel hasil download...</div>
            </div>
            <label>Nama Sekolah / Judul</label>
            <input type="text" id="sch_name" value="SDN 1 LINGGA PURA TP. 2025/2026" oninput="render()">
        </div>

        <!-- PANEL ATRIBUT -->
        <div class="panel">
            <h3>🛡️ Logo & Pengesahan</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="upload-box"><input type="file" onchange="prev(event, 'lk')"><div class="upload-ui">Logo Kiri...</div></div>
                <div class="upload-box"><input type="file" onchange="prev(event, 'lr')"><div class="upload-ui">Logo Kanan...</div></div>
            </div>
            <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 10px;">
                <input type="text" id="ks_name" value="ROSYIDIN, S.Pd" placeholder="Nama Kepsek" oninput="render()">
                <input type="text" id="ks_nip" value="NIP. 19700605 201410 1 003" placeholder="NIP" oninput="render()">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="upload-box"><input type="file" onchange="prev(event, 's')"><div class="upload-ui">Stempel...</div></div>
                <div class="upload-box"><input type="file" onchange="prev(event, 't')"><div class="upload-ui">TTD...</div></div>
            </div>
        </div>

        <!-- PANEL MANUAL -->
        <div class="panel full">
            <h3>✍️ Input Manual</h3>
            <div style="display: grid; grid-template-columns: 1.5fr 1fr 1fr 0.7fr 1fr; gap: 12px;">
                <input type="text" id="m_nama" placeholder="Nama Lengkap">
                <input type="text" id="m_no" placeholder="No Peserta">
                <input type="text" id="m_ttl" placeholder="Tempat, Tgl Lahir">
                <input type="text" id="m_ruang" placeholder="Ruang">
                <button class="btn btn-add" onclick="addManual()">➕ Tambah</button>
            </div>
        </div>
    </div>
    
    <button class="btn btn-print" onclick="window.print()">🔥 CETAK SEMUA KARTU SEKARANG</button>
</div>

<div id="print-area"></div>

<script>
    let dataSiswa = [];
    let img = { lk: '', lr: '', t: '', s: '' };

    function dlTpl() {
        const ws = XLSX.utils.aoa_to_sheet([["Nama", "TTL", "NoPeserta", "Ruang"]]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, "Template_Data_Siswa.xlsx");
    }

    function addManual() {
        const n = document.getElementById('m_nama').value, no = document.getElementById('m_no').value;
        const t = document.getElementById('m_ttl').value, r = document.getElementById('m_ruang').value;
        if(!n) return alert("Isi Nama minimal!");
        dataSiswa.push({ Nama: n, NoPeserta: no, TTL: t, Ruang: r });
        render();
        ['m_nama', 'm_no', 'm_ttl', 'm_ruang'].forEach(id => document.getElementById(id).value = '');
    }

    function prev(e, k) {
        const f = e.target.files[0]; if(!f) return;
        e.target.nextElementSibling.innerText = f.name;
        const r = new FileReader(); r.onload = () => { img[k] = r.result; render(); }; r.readAsDataURL(f);
    }

    document.getElementById('fileIn').addEventListener('change', function(e) {
        const f = e.target.files[0]; if(!f) return;
        document.getElementById('txtFileIn').innerText = f.name;
        const r = new FileReader();
        r.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            dataSiswa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            render();
        };
        r.readAsArrayBuffer(f);
    });

    function render() {
        const area = document.getElementById('print-area'); area.innerHTML = '';
        const sch = document.getElementById('sch_name').value;
        const ks = document.getElementById('ks_name').value;
        const nip = document.getElementById('ks_nip').value;

        dataSiswa.forEach(s => {
            const div = document.createElement('div'); div.className = 'card';
            div.innerHTML = `
                <div class="card-header">
                    <img src="${img.lk}" class="logo-img" style="${!img.lk ? 'visibility:hidden' : ''}">
                    <div class="header-title">KARTU PESERTA UJIAN SEKOLAH<br>${sch}</div>
                    <img src="${img.lr}" class="logo-img" style="${!img.lr ? 'visibility:hidden' : ''}">
                </div>
                <div class="tag-ruang">RUANG: ${s.Ruang || '01'}</div>
                <div class="card-body">
                    <table class="data-table">
                        <tr><td width="75">No. Peserta</td><td>: <b>${s.NoPeserta || '-'}</b></td></tr>
                        <tr><td>Nama</td><td>: <b style="text-transform:uppercase">${s.Nama || '-'}</b></td></tr>
                        <tr><td>TTL</td><td>: <b>${s.TTL || '-'}</b></td></tr>
                    </table>
                    <div class="photo-area">PAS FOTO 3X4</div>
                    <div class="note-box">* Kartu Wajib dibawa Setiap Hari Pelaksanaan</div>
                </div>
                <div class="footer-sign">
                    <div style="font-size:9px">Lingga Pura, 18 Mei 2026<br>Kepala Sekolah,</div>
                    <div class="sign-wrap">
                        ${img.s ? `<img src="${img.s}" class="img-stamp">` : ''}
                        ${img.t ? `<img src="${img.t}" class="img-ttd">` : ''}
                    </div>
                    <div style="font-size:10px"><b>${ks}</b><br>${nip}</div>
                </div>
            `;
            area.appendChild(div);
        });
    }
</script>
</body>
</html>
