<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kartu Ujian Pro - Clean Design</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --bg: #f1f5f9; --success: #22c55e; }
        body { font-family: 'Open Sans', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        /* Container Utama */
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        h2 { font-family: 'Montserrat', sans-serif; text-align: center; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* Grid Layout agar tidak berantakan */
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .section { display: flex; flex-direction: column; gap: 15px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fafafa; }
        
        label { font-weight: 700; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 13px; box-sizing: border-box; }
        
        /* Tombol Download yang Nongol tapi Rapi */
        .btn-dl { background: var(--success); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.2); }
        .btn-dl:hover { background: #16a34a; transform: translateY(-2px); }

        .btn-print { grid-column: span 2; background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 18px; border: none; border-radius: 15px; font-weight: 800; font-size: 18px; cursor: pointer; margin-top: 20px; }

        /* KARTU PREVIEW */
        #print-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 40px; width: 210mm; margin-left: auto; margin-right: auto; }
        .card { 
            width: 9.5cm; height: 6.8cm; border: 2px solid #000; padding: 12px; position: relative; 
            box-sizing: border-box; background: linear-gradient(180deg, #ffffff 65%, #dbeafe 100%); 
        }

        @media print { .container { display: none; } #print-area { margin: 0; } .card { -webkit-print-color-adjust: exact; } }
        @media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; } .btn-print { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="container">
    <h2>APLIKASI GENERATE CART</h2>
    
    <div class="main-grid">
        <!-- Bagian Kiri: Data Siswa -->
        <div class="section">
            <label>📊 Download Template</label>
            <button class="btn-dl" onclick="dlTpl()">📥 DOWNLOAD TEMPLATE EXCEL</button>
            
            <label>📂 Upload Data Siswa</label>
            <input type="file" id="fileIn" accept=".xlsx, .xls">
            
            <label>🏫 Nama Sekolah / Tahun Pelajaran</label>
            <input type="text" id="sch_name" value="SDN 1 LINGGA PURA TP. 2025/2026" oninput="render()">
        </div>

        <!-- Bagian Kanan: Pengesahan -->
        <div class="section">
            <label>👤 Nama Kepala Sekolah</label>
            <input type="text" id="ks_name" value="ROSYIDIN, S.Pd" oninput="render()">
            
            <label>🆔 NIP Kepala Sekolah</label>
            <input type="text" id="ks_nip" value="NIP. 19700605 201410 1 003" oninput="render()">

            <label>💠 Upload Stempel (PNG Transparan)</label>
            <input type="file" onchange="prev(event, 's')">
            
            <label>✍️ Upload Tanda Tangan (PNG Transparan)</label>
            <input type="file" onchange="prev(event, 't')">
        </div>

        <button class="btn-print" onclick="window.print()">🔥 CETAK KARTU SEKARANG</button>
    </div>
</div>

<div id="print-area"></div>

<script>
    let data = [];
    let img = { t: '', s: '' };

    function dlTpl() {
        const header = [["Nama", "TTL", "NoPeserta", "Ruang"]];
        const sample = [["AHMAD FARHAN FATHONI", "Lingga Pura, 07 Juni 2003", "001", "01"]];
        const ws = XLSX.utils.aoa_to_sheet([...header, ...sample]);
        const wb = XLSX.utils.book_new(); 
        XLSX.utils.book_append_sheet(wb, ws, "DataSiswa");
        XLSX.writeFile(wb, "Template_Kartu_Ujian.xlsx");
    }

    function prev(e, k) {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = () => { img[k] = r.result; render(); };
        r.readAsDataURL(file);
    }

    document.getElementById('fileIn').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            render();
        };
        r.readAsArrayBuffer(file);
    });

    function render() {
        const area = document.getElementById('print-area');
        area.innerHTML = '';
        const sch = document.getElementById('sch_name').value;
        const ks = document.getElementById('ks_name').value;
        const nip = document.getElementById('ks_nip').value;

        data.forEach(s => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:5px; margin-bottom:10px;">
                    <b style="font-size:10px; font-family:'Montserrat'">KARTU PESERTA UJIAN SEKOLAH<br>${sch}</b>
                </div>
                <div style="position:absolute; top:55px; right:10px; border:1.5px solid #000; padding:2px 8px; font-weight:800; font-size:12px; background:#fff;">RUANG: ${s.Ruang || '-'}</div>
                <table style="font-size:10px; width:65%; border-collapse:collapse;">
                    <tr><td width="60">No. Peserta</td><td>: <b>${s.NoPeserta || '-'}</b></td></tr>
                    <tr><td>Nama</td><td>: <b style="text-transform:uppercase">${s.Nama || '-'}</b></td></tr>
                    <tr><td>TTL</td><td>: <b>${s.TTL || '-'}</b></td></tr>
                </table>
                <div style="width:2.1cm; height:2.8cm; border:1px solid #000; margin-top:10px; display:flex; align-items:center; justify-content:center; font-size:8px; background:#fff;">3 x 4</div>
                
                <div style="position:absolute; bottom:25px; right:10px; text-align:center; font-size:9px; width:160px;">
                    Lingga Pura, 18 Mei 2026<br>Kepala Sekolah,
                    <div style="position:relative; height:45px;">
                        ${img.s ? `<img src="${img.s}" style="position:absolute; height:60px; left:10px; top:-5px; opacity:0.8; mix-blend-mode:multiply;">` : ''}
                        ${img.t ? `<img src="${img.t}" style="position:absolute; height:40px; left:40px; top:0; mix-blend-mode:multiply;">` : ''}
                    </div>
                    <b>${ks}</b><br>${nip}
                </div>
            `;
            area.appendChild(div);
        });
    }
</script>
</body>
</html>
