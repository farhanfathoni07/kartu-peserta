<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Generator Kartu Ujian Pro - Hybrid</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --accent: #10b981;
            --bg: #f8fafc;
        }

        body { font-family: 'Open Sans', sans-serif; background: var(--bg); margin: 0; color: #1e293b; }
        .no-print { max-width: 1000px; margin: 30px auto; padding: 40px; background: white; border-radius: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); }
        h2 { font-family: 'Montserrat', sans-serif; text-align: center; color: var(--primary); font-size: 28px; margin-bottom: 30px; }
        
        .grid-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-card { background: #ffffff; padding: 20px; border-radius: 20px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        label { display: block; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 11px; margin-bottom: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }

        /* Custom File Input */
        .file-wrapper { position: relative; margin-bottom: 15px; }
        .file-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .custom-file-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #f1f5f9; color: #475569; padding: 10px; border-radius: 10px; border: 2px dashed #cbd5e1; font-weight: 600; font-size: 12px; transition: 0.3s; }
        .file-wrapper:hover .custom-file-btn { background: #e2e8f0; border-color: var(--secondary); color: var(--primary); }

        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 2px solid #f1f5f9; border-radius: 10px; background: #f8fafc; margin-bottom: 10px; box-sizing: border-box; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--secondary); background: white; }

        /* Area Manual */
        .manual-box { background: #fdf2f2; border: 1px solid #fee2e2; padding: 15px; border-radius: 15px; margin-top: 10px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 5px; transition: 0.3s; }
        .btn-add:hover { background: var(--secondary); }

        /* Tombol Cetak */
        .btn-print { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 18px; border: none; border-radius: 15px; font-family: 'Montserrat', sans-serif; font-weight: 800; cursor: pointer; width: 100%; font-size: 18px; margin-top: 25px; box-shadow: 0 10px 20px rgba(30, 58, 138, 0.3); animation: pulse 2s infinite; transition: 0.3s; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

        /* Desain Kartu */
        #print-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; justify-items: center; }
        .card { width: 12.5cm; height: 8.5cm; border: 2px solid #000; background: #fff; padding: 15px; position: relative; box-sizing: border-box; page-break-inside: avoid; }
        .header { display: flex; align-items: center; border-bottom: 3px double #000; padding-bottom: 10px; margin-bottom: 12px; }
        .logo-img { width: 60px; height: 60px; object-fit: contain; }
        .header-text { flex-grow: 1; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px; text-align: center; line-height: 1.2; }
        .ruang-box { position: absolute; top: 90px; right: 20px; border: 2px solid #000; padding: 2px 10px; font-weight: 800; font-size: 14px; background: #f8fafc; }
        .content { display: flex; gap: 15px; margin-top: 15px; }
        .photo-box { width: 3cm; height: 4cm; border: 1.5px solid #000; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 10px; text-align: center; font-weight: 600; }
        .details table { font-size: 13px; border-collapse: collapse; width: 100%; }
        .details td { padding: 4px 0; }
        .val { font-weight: 700; padding-left: 8px; }
        .footer { position: absolute; bottom: 12px; right: 20px; text-align: center; font-size: 11px; width: 230px; }
        .ttd-img { height: 55px; position: absolute; left: 50%; transform: translateX(-50%); bottom: 35px; z-index: 1; mix-blend-mode: multiply; }

        @media print { .no-print { display: none; } #print-area { display: block; } .card { margin: 10px auto; } }
    </style>
</head>
<body>

<div class="no-print">
    <h2>🚀 Kartu Ujian Pro Designer</h2>
    
    <div class="grid-panel">
        <div class="input-card">
            <label>🏫 Identitas & Logo</label>
            <div style="display: flex; gap: 10px;">
                <div class="file-wrapper" style="flex:1"><div class="custom-file-btn">Logo L</div><input type="file" onchange="previewImg(event, 'l-img')"></div>
                <div class="file-wrapper" style="flex:1"><div class="custom-file-btn">Logo R</div><input type="file" onchange="previewImg(event, 'r-img')"></div>
            </div>
            <input type="text" id="sch_name" value="SMAN 1 PRINGGARATA TP. 2025/2026" oninput="renderCards()">
            
            <label>🖋️ Pengesahan</label>
            <div class="file-wrapper"><div class="custom-file-btn">Upload TTD (PNG)</div><input type="file" onchange="previewImg(event, 't-img')"></div>
            <input type="text" id="ks_name" value="H. IWAN RIAMAN, S.Pd., M.Pd." oninput="renderCards()">
            <input type="text" id="ks_nip" value="NIP. 19711231 199702 1 014" oninput="renderCards()">
        </div>

        <div class="input-card">
            <label>⌨️ Input Data Manual</label>
            <div class="manual-box">
                <input type="text" id="m_nama" placeholder="Nama Lengkap">
                <input type="text" id="m_ttl" placeholder="Tempat, Tanggal Lahir">
                <input type="text" id="m_nomer" placeholder="Nomer Peserta">
                <input type="text" id="m_ruang" placeholder="Nomer Ruang">
                <button class="btn-add" onclick="addManual()">➕ Tambah ke Daftar</button>
            </div>
            
            <label style="margin-top:20px">📂 Atau Upload Keseluruhan (Excel)</label>
            <div class="file-wrapper">
                <div class="custom-file-btn" style="background: #ecfdf5; border-color: #a7f3d0; color: #065f46;">📥 Pilih File Excel</div>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
            </div>
            <p style="font-size: 9px; color: #64748b;">*Kolom Excel: Nama, TTL, NoPeserta, Ruang</p>
        </div>
    </div>

    <button class="btn-print" onclick="window.print()">🔥 CETAK SEMUA KARTU</button>
    <button onclick="clearData()" style="background:none; border:none; color:red; cursor:pointer; font-size:11px; margin-top:10px; width:100%">🗑️ Hapus Semua Data</button>
</div>

<div id="print-area"></div>

<script>
    let studentData = [];
    let imgs = { logoL: '', logoR: '', ttd: '' };

    function previewImg(e, type) {
        const reader = new FileReader();
        reader.onload = () => {
            if(type === 'l-img') imgs.logoL = reader.result;
            if(type === 'r-img') imgs.logoR = reader.result;
            if(type === 't-img') imgs.ttd = reader.result;
            renderCards();
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function addManual() {
        const nama = document.getElementById('m_nama').value;
        const ttl = document.getElementById('m_ttl').value;
        const nomer = document.getElementById('m_nomer').value;
        const ruang = document.getElementById('m_ruang').value;

        if(!nama) return alert("Nama harus diisi!");
        
        studentData.push({ Nama: nama, TTL: ttl, NoPeserta: nomer, Ruang: ruang });
        renderCards();
        
        // Reset input
        document.getElementById('m_nama').value = '';
        document.getElementById('m_ttl').value = '';
        document.getElementById('m_nomer').value = '';
        document.getElementById('m_ruang').value = '';
    }

    function clearData() {
        if(confirm("Hapus semua daftar siswa?")) {
            studentData = [];
            renderCards();
        }
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const excelData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            // Gabungkan data yang sudah ada dengan data excel
            studentData = [...studentData, ...excelData];
            renderCards();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function renderCards() {
        const area = document.getElementById('print-area');
        const sch = document.getElementById('sch_name').value;
        const ks = document.getElementById('ks_name').value;
        const nip = document.getElementById('ks_nip').value;
        area.innerHTML = '';

        studentData.forEach(s => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="header">
                    <img src="${imgs.logoL}" class="logo-img" style="${!imgs.logoL?'visibility:hidden':''}">
                    <div class="header-text">KARTU PESERTA UJIAN SEKOLAH<br>${sch}</div>
                    <img src="${imgs.logoR}" class="logo-img" style="${!imgs.logoR?'visibility:hidden':''}">
                </div>
                <div class="ruang-box">RUANG: ${s.Ruang || s.ruang || '-'}</div>
                <div class="content">
                    <div class="photo-box">PAS FOTO<br>3 x 4</div>
                    <div class="details">
                        <table>
                            <tr><td width="100">No. Peserta</td><td>: <span class="val">${s.NoPeserta || s.nomer || '-'}</span></td></tr>
                            <tr><td>Nama</td><td>: <span class="val" style="text-transform:uppercase">${s.Nama || s.nama || '-'}</span></td></tr>
                            <tr><td>TTL</td><td>: <span class="val">${s.TTL || s.ttl || '-'}</span></td></tr>
                        </table>
                    </div>
                </div>
                <div class="footer">
                    Pringgarata, ${new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}<br>
                    Kepala Sekolah,
                    ${imgs.ttd ? `<img src="${imgs.ttd}" class="ttd-img">` : '<div style="height:55px"></div>'}
                    <div style="margin-top:40px"><b>${ks}</b></div>
                    ${nip}
                </div>
            `;
            area.appendChild(card);
        });
    }
</script>

</body>
</html>
