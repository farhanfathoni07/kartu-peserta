<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APLIKASI GENERATE CART</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --secondary: #2563eb; --accent: #f59e0b; --bg: #f1f5f9; }
        body { font-family: 'Open Sans', sans-serif; background: var(--bg); margin: 0; color: #1e293b; padding: 10px; }
        
        .no-print { max-width: 900px; margin: 10px auto; padding: 20px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { font-family: 'Montserrat', sans-serif; text-align: center; color: var(--primary); margin-top: 0; }
        
        .grid-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-card { background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; }
        
        /* TOMBOL EXCEL DIBUAT MENYALA (NONGOL) */
        .btn-download-template { 
            background: #22c55e; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%; 
            font-size: 13px; 
            font-weight: 800; 
            cursor: pointer; 
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: 0.3s;
        }
        .btn-download-template:hover { background: #16a34a; transform: translateY(-2px); }

        .btn-print { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 15px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; font-size: 16px; margin-top: 15px; }

        /* AREA CETAK */
        #print-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; width: 210mm; margin: 20px auto; }
        
        /* WARNA BACKGROUND KARTU LEBIH TAJAM (NONGOL) */
        .card { 
            width: 9.5cm; 
            height: 6.8cm; 
            border: 1.5px solid #000; 
            padding: 10px; 
            position: relative; 
            box-sizing: border-box; 
            page-break-inside: avoid; 
            overflow: hidden;
            /* Gradasi Biru Langit yang lebih kuat di bawah */
            background: linear-gradient(180deg, #ffffff 60%, #dbeafe 100%);
        }

        .header { display: flex; align-items: center; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 8px; position: relative; z-index: 2; }
        .logo-img { width: 40px; height: 40px; object-fit: contain; }
        .header-text { flex-grow: 1; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 9px; text-align: center; }
        
        .ruang-box { position: absolute; top: 62px; right: 10px; border: 1.5px solid #000; padding: 1px 6px; font-weight: 800; font-size: 11px; background: #fff; z-index: 5; }
        
        .main-content { display: flex; flex-direction: column; gap: 5px; width: 60%; position: relative; z-index: 2; }
        .val { font-weight: 700; padding-left: 3px; }
        .photo-box { width: 2.1cm; height: 2.8cm; border: 1.2px solid #000; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 7px; font-weight: 600; }

        .footer-right { position: absolute; bottom: 25px; right: 5px; text-align: center; font-size: 9px; width: 170px; z-index: 2; }
        .ttd-box { position: relative; height: 45px; width: 100%; margin: 2px 0; }
        .stempel-img { position: absolute; height: 65px; left: 15px; top: -10px; z-index: 1; opacity: 0.9; mix-blend-mode: multiply; }
        .ttd-img { position: absolute; height: 45px; left: 35%; top: -5px; z-index: 2; mix-blend-mode: multiply; }

        @media print { 
            .no-print { display: none; } 
            #print-area { display: grid !important; width: 210mm; margin: 0; } 
            .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; } /* Memastikan background ikut tercetak */
        }
    </style>
</head>
<body>

<div class="no-print">
    <h2>🛠️ Generator Kartu Ujian Pro</h2>
    <div class="grid-panel">
        <div class="input-card">
            <label>📊 FORMAT DATA (PENTING)</label>
            <button class="btn-download-template" onclick="dlTpl()">📥 DOWNLOAD TEMPLATE EXCEL DISINI</button>
            
            <label>📂 IMPORT FILE EXCEL</label>
            <input type="file" id="fileIn" accept=".xlsx, .xls">
            
            <label>🏫 NAMA SEKOLAH / TP</label>
            <input type="text" id="sch_name" value="SDN 1 LINGGA PURA TP. 2025/2026" oninput="render()">
        </div>

        <div class="input-card">
            <label>🛡️ LOGO & PENGESAHAN</label>
            <div style="display: flex; gap: 5px;">
                <input type="file" onchange="prev(event, 's')" placeholder="Stempel">
                <input type="file" onchange="prev(event, 't')" placeholder="TTD">
            </div>
            <label>👤 KEPALA SEKOLAH</label>
            <input type="text" id="ks_name" value="ROSYIDIN, S.Pd" oninput="render()">
            <input type="text" id="ks_nip" value="NIP. 19700605 201410 1 003" oninput="render()">
        </div>
    </div>
    <button class="btn-print" onclick="window.print()">🔥 CETAK KARTU</button>
</div>

<div id="print-area"></div>

<script>
    let data = [];
    let img = { l: '', r: '', t: '', s: '' };

    // Fungsi membuat file Excel otomatis agar tidak hilang lagi
    function dlTpl() {
        const header = [["Nama", "TTL", "NoPeserta", "Ruang"]];
        const sample = [["AHMAD FARHAN FATHONI", "Lingga Pura, 07 juni 2003", "001", "01"]];
        const ws = XLSX.utils.aoa_to_sheet([...header, ...sample]);
        const wb = XLSX.utils.book_new(); 
        XLSX.utils.book_append_sheet(wb, ws, "DataSiswa");
        XLSX.writeFile(wb, "Template_Kartu_Ujian.xlsx");
    }

    function prev(e, k) {
        if (!e.target.files[0]) return;
        const r = new FileReader();
        r.onload = () => { img[k] = r.result; render(); };
        r.readAsDataURL(e.target.files[0]);
    }

    document.getElementById('fileIn').addEventListener('change', function(e) {
        const r = new FileReader();
        r.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            render();
        };
        r.readAsArrayBuffer(e.target.files[0]);
    });

    function render() {
        const area = document.getElementById('print-area'); area.innerHTML = '';
        const sch = document.getElementById('sch_name').value;
        const ks = document.getElementById('ks_name').value;
        const nip = document.getElementById('ks_nip').value;

        data.forEach(s => {
            const div = document.createElement('div'); div.className = 'card';
            div.innerHTML = `
                <div class="header">
                    <div class="header-text">KARTU PESERTA UJIAN SEKOLAH<br>${sch}</div>
                </div>
                <div class="ruang-box">RUANG: ${s.Ruang || '-'}</div>
                <div class="main-content">
                    <table style="font-size:10px">
                        <tr><td>No. Peserta</td><td>: <span class="val">${s.NoPeserta || '-'}</span></td></tr>
                        <tr><td>Nama</td><td>: <span class="val" style="text-transform:uppercase">${s.Nama || '-'}</span></td></tr>
                        <tr><td>TTL</td><td>: <span class="val">${s.TTL || '-'}</span></td></tr>
                    </table>
                    <div class="photo-box">PAS FOTO<br>3 x 4</div>
                </div>
                <div class="footer-right">
                    Lingga Pura, 18 Mei 2026<br>Kepala Sekolah,
                    <div class="ttd-box">
                        ${img.s ? `<img src="${img.s}" class="stempel-img">` : ''}
                        ${img.t ? `<img src="${img.t}" class="ttd-img">` : ''}
                    </div>
                    <div><b>${ks}</b></div><div style="font-size:8px">${nip}</div>
                </div>
            `;
            area.appendChild(div);
        });
    }
</script>
</body>
</html>
