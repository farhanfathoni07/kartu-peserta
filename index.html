<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kartu Ujian Pro - Animated</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --accent: #10b981;
            --bg: #f8fafc;
        }

        body { 
            font-family: 'Open Sans', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: #1e293b;
        }

        .no-print { 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 40px; 
            background: white; 
            border-radius: 30px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
        }

        h2 { 
            font-family: 'Montserrat', sans-serif; 
            text-align: center; 
            color: var(--primary);
            font-size: 32px;
            margin-bottom: 40px;
        }

        .grid-panel { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
        }

        .input-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        label { 
            display: block; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 11px; 
            margin-bottom: 15px; 
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Styling Custom File Input */
        .file-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .file-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        .custom-file-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f1f5f9;
            color: #475569;
            padding: 12px;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .file-wrapper:hover .custom-file-btn {
            background: #e2e8f0;
            border-color: var(--secondary);
            color: var(--primary);
            transform: scale(1.02);
        }

        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #f1f5f9; 
            border-radius: 12px; 
            background: #f8fafc;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--secondary);
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Tombol Cetak Animasi */
        .btn-print { 
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white; 
            padding: 20px; 
            border: none; 
            border-radius: 15px; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 800; 
            cursor: pointer; 
            width: 100%;
            font-size: 18px;
            margin-top: 30px;
            box-shadow: 0 10px 20px rgba(30, 58, 138, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulse 2s infinite;
        }

        .btn-print:hover { 
            transform: scale(1.03) translateY(-5px);
            box-shadow: 0 20px 30px rgba(30, 58, 138, 0.4);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* Desain Kartu (Tetap Presisi) */
        #print-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; justify-items: center; }
        .card { width: 12.5cm; height: 8.5cm; border: 2px solid #000; background: #fff; padding: 15px; position: relative; box-sizing: border-box; page-break-inside: avoid; }
        .header { display: flex; align-items: center; border-bottom: 3px double #000; padding-bottom: 10px; margin-bottom: 12px; }
        .logo-img { width: 65px; height: 65px; object-fit: contain; }
        .header-text { flex-grow: 1; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; text-align: center; line-height: 1.2; }
        .ruang-box { position: absolute; top: 90px; right: 20px; border: 2px solid #000; padding: 3px 12px; font-weight: 800; font-size: 15px; background: #f8fafc; }
        .content { display: flex; gap: 20px; margin-top: 15px; }
        .photo-box { width: 3cm; height: 4cm; border: 1.5px solid #000; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 10px; text-align: center; font-weight: 600; }
        .details table { font-size: 13px; border-collapse: collapse; width: 100%; }
        .details td { padding: 4px 0; }
        .val { font-weight: 700; padding-left: 8px; }
        .footer { position: absolute; bottom: 15px; right: 20px; text-align: center; font-size: 11px; width: 230px; }
        .ttd-img { height: 60px; position: absolute; left: 50%; transform: translateX(-50%); bottom: 35px; z-index: 1; mix-blend-mode: multiply; }

        @media print { .no-print { display: none; } #print-area { display: block; } .card { margin: 10px auto; } }
    </style>
</head>
<body>

<div class="no-print">
    <h2>✨ Generator Kartu Ujian</h2>
    
    <div class="grid-panel">
        <!-- Panel Kiri -->
        <div class="input-card">
            <label>🖼️ Upload Logo Sekolah</label>
            <div style="display: flex; gap: 10px;">
                <div class="file-wrapper" style="flex:1">
                    <div class="custom-file-btn">📁 Logo Kiri</div>
                    <input type="file" onchange="previewImg(event, 'l-img')">
                </div>
                <div class="file-wrapper" style="flex:1">
                    <div class="custom-file-btn">📁 Logo Kanan</div>
                    <input type="file" onchange="previewImg(event, 'r-img')">
                </div>
            </div>

            <label>🏫 Identitas Institusi</label>
            <input type="text" id="sch_name" value="SMAN 1 PRINGGARATA TP. 2025/2026" oninput="renderCards()">
        </div>

        <!-- Panel Kanan -->
        <div class="input-card">
            <label>🖋️ Tanda Tangan & Pejabat</label>
            <div class="file-wrapper">
                <div class="custom-file-btn">✍️ Upload TTD (PNG)</div>
                <input type="file" onchange="previewImg(event, 't-img')">
            </div>
            <input type="text" id="ks_name" value="H. IWAN RIAMAN, S.Pd., M.Pd." oninput="renderCards()">
            <input type="text" id="ks_nip" value="NIP. 19711231 199702 1 014" oninput="renderCards()">
        </div>
    </div>

    <!-- Data Excel -->
    <div class="input-card" style="margin-top: 25px; border-top: 4px solid var(--accent);">
        <label>📊 Database Peserta (Excel)</label>
        <div class="file-wrapper">
            <div class="custom-file-btn" style="background: #ecfdf5; border-color: #a7f3d0; color: #065f46;">📥 Pilih File Excel Siswa</div>
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
        </div>
    </div>

    <button class="btn-print" onclick="window.print()">🔥 CETAK SEKARANG</button>
</div>

<div id="print-area"></div>

<script>
    let studentData = [];
    let imgs = { logoL: '', logoR: '', ttd: '' };

    function previewImg(e, type) {
        const reader = new FileReader();
        reader.onload = () => {
            if(type === 'l-img') imgs.logoL = reader.result;
            if(type === 'r-img') imgs.logoR = reader.result;
            if(type === 't-img') imgs.ttd = reader.result;
            renderCards();
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            studentData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            renderCards();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function renderCards() {
        const area = document.getElementById('print-area');
        const sch = document.getElementById('sch_name').value;
        const ks = document.getElementById('ks_name').value;
        const nip = document.getElementById('ks_nip').value;
        area.innerHTML = '';

        studentData.forEach(s => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="header">
                    <img src="${imgs.logoL}" class="logo-img" style="${!imgs.logoL?'visibility:hidden':''}">
                    <div class="header-text">KARTU PESERTA UJIAN SEKOLAH<br>${sch}</div>
                    <img src="${imgs.logoR}" class="logo-img" style="${!imgs.logoR?'visibility:hidden':''}">
                </div>
                <div class="ruang-box">RUANG: ${s.Ruang || '-'}</div>
                <div class="content">
                    <div class="photo-box">PAS FOTO<br>3 x 4</div>
                    <div class="details">
                        <table>
                            <tr><td width="100">No. Peserta</td><td>: <span class="val">${s.NoPeserta || '-'}</span></td></tr>
                            <tr><td>Nama</td><td>: <span class="val" style="text-transform:uppercase">${s.Nama || '-'}</span></td></tr>
                            <tr><td>NIS</td><td>: <span class="val">${s.NIS || '-'}</span></td></tr>
                            <tr><td>TTL</td><td>: <span class="val">${s.TTL || '-'}</span></td></tr>
                            <tr><td>Program</td><td>: <span class="val">${s.Program || '-'}</span></td></tr>
                        </table>
                    </div>
                </div>
                <div class="footer">
                    Pringgarata, ${new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}<br>
                    Kepala Sekolah,
                    ${imgs.ttd ? `<img src="${imgs.ttd}" class="ttd-img">` : '<div style="height:60px"></div>'}
                    <div style="margin-top:45px"><b>${ks}</b></div>
                    ${nip}
                </div>
            `;
            area.appendChild(card);
        });
    }
</script>

</body>
</html>
