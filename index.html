<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kartu Ujian - Button Ruang</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; margin: 0; padding: 20px; }
        
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 20px; border-radius: 15px; }
        .full { grid-column: span 2; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; width: 100%; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; margin-top: 10px; }
        .btn-print { background: var(--dark); color: white; padding: 15px; font-size: 16px; margin-top: 20px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .upload-field { position: relative; height: 38px; margin-bottom: 10px; }
        .upload-field input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
        .upload-label { position: absolute; top:0; left:0; width: 100%; height: 100%; background: #fff; border: 1.5px solid #cbd5e1; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 600; color: #64748b; box-sizing: border-box; }

        #print-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10mm; margin-top: 30px; }
        .card { 
            width: 9.5cm; height: 6.8cm; border: 1.5px solid #000; padding: 8px; position: relative; 
            box-sizing: border-box; background: #fff; overflow: hidden; page-break-inside: avoid;
        }
        
        .card-header { display: flex; align-items: center; border-bottom: 1.5px solid #000; padding-bottom: 5px; margin-bottom: 8px; }
        .logo-img { width: 35px; height: 35px; object-fit: contain; }
        .header-title { text-align: center; flex: 1; font-weight: 700; font-size: 10px; line-height: 1.2; }
        
        /* REVISI: RUANG DIBUAT SEPERTI BUTTON (KOTAK) */
        .tag-ruang { 
            position: absolute; 
            top: 60px; 
            right: 15px; 
            font-size: 12px; 
            font-weight: 800; 
            border: 2px solid #000; 
            padding: 4px 10px; 
            background: #fff;
            min-width: 80px;
            text-align: center;
        }

        .data-table { font-size: 10.5px; width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .data-table td { padding: 1.5px 0; vertical-align: top; }
        .label-col { width: 95px; }

        .bottom-container { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 5px; }
        .photo-box { width: 2.1cm; height: 2.8cm; border: 1.5px solid #000; display: flex; align-items: center; justify-content: center; font-size: 7px; background: #f0f0f0; font-weight: 700; }
        
        .footer-section { text-align: center; width: 170px; margin-bottom: 5px; }
        .sign-area { position: relative; height: 45px; }
        .img-s { position: absolute; height: 60px; left: 10px; top: -10px; opacity: 0.6; mix-blend-mode: multiply; z-index: 1; }
        .img-t { position: absolute; height: 45px; left: 45px; top: 0; mix-blend-mode: multiply; z-index: 2; }
        .ks-name { font-size: 10px; font-weight: 800; }
        .ks-nip { font-size: 9px; margin-top: 1px; }

        .note-text { 
            position: absolute; 
            bottom: 6px; 
            left: 8px; 
            font-size: 7px; 
            color: #444; 
            width: auto; 
            font-style: italic;
        }

        @media print { .container { display: none; } #print-area { margin: 0; } }
    </style>
</head>
<body>

<div class="container">
    <header><h1 style="text-align: center; color: var(--primary);">KARTU UJIAN GENERATOR</h1></header>
    <div class="grid-main">
        <div class="panel">
            <h3>📂 Data Utama</h3>
            <div class="upload-field"><input type="file" id="fileIn" accept=".xlsx, .xls"><div class="upload-label" id="lblExcel">Pilih Data Peserta (Excel)</div></div>
            <input type="text" id="sch_name" value="SDN 1 LINGGA PURA TP. 2025/2026" oninput="render()">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="upload-field"><input type="file" onchange="prev(event,'lk')"><div class="upload-label">Logo 1</div></div>
                <div class="upload-field"><input type="file" onchange="prev(event,'lr')"><div class="upload-label">Logo 2</div></div>
            </div>
        </div>
        <div class="panel">
            <h3>🛡️ Tanda Tangan</h3>
            <input type="text" id="ks_name" value="ROSYIDIN, S.Pd" oninput="render()">
            <input type="text" id="ks_nip" value="NIP. 19700605 201410 1 003" oninput="render()">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="upload-field"><input type="file" onchange="prev(event,'s')"><div class="upload-label">Stempel</div></div>
                <div class="upload-field"><input type="file" onchange="prev(event,'t')"><div class="upload-label">TTD Kepala</div></div>
            </div>
        </div>
        <div class="panel full">
            <h3>✍️ Input Peserta Manual</h3>
            <div style="display:grid; grid-template-columns: 1.5fr 1fr 1fr 0.5fr 0.8fr; gap:10px;">
                <input type="text" id="m_nama" placeholder="Nama Lengkap">
                <input type="text" id="m_no" placeholder="No Peserta">
                <input type="text" id="m_ttl" placeholder="Tempat, Tgl Lahir">
                <input type="text" id="m_ruang" placeholder="Ruang">
                <button class="btn btn-add" onclick="addManual()">Tambah</button>
            </div>
        </div>
    </div>
    <button class="btn btn-print" onclick="window.print()">CETAK KARTU</button>
</div>

<div id="print-area"></div>

<script>
    let dataSiswa = [];
    let img = { lk: '', lr: '', t: '', s: '' };

    function addManual() {
        const n = document.getElementById('m_nama').value, no = document.getElementById('m_no').value;
        const t = document.getElementById('m_ttl').value, r = document.getElementById('m_ruang').value;
        if(!n) return;
        dataSiswa.push({ Nama: n, NoPeserta: no, TTL: t, Ruang: r });
        render();
        ['m_nama', 'm_no', 'm_ttl', 'm_ruang'].forEach(id => document.getElementById(id).value = '');
    }

    function prev(e, k) {
        const f = e.target.files[0]; if(!f) return;
        e.target.nextElementSibling.innerText = f.name;
        const r = new FileReader(); r.onload = () => { img[k] = r.result; render(); }; r.readAsDataURL(f);
    }

    document.getElementById('fileIn').addEventListener('change', function(e) {
        const f = e.target.files[0]; if(!f) return;
        document.getElementById('lblExcel').innerText = f.name;
        const r = new FileReader();
        r.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            dataSiswa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            render();
        };
        r.readAsArrayBuffer(f);
    });

    function render() {
        const area = document.getElementById('print-area'); area.innerHTML = '';
        const sch = document.getElementById('sch_name').value;
        const ks = document.getElementById('ks_name').value;
        const nip = document.getElementById('ks_nip').value;

        dataSiswa.forEach(s => {
            const div = document.createElement('div'); div.className = 'card';
            div.innerHTML = `
                <div class="card-header">
                    <img src="${img.lk}" class="logo-img" style="${!img.lk ? 'visibility:hidden' : ''}">
                    <div class="header-title">KARTU PESERTA UJIAN SEKOLAH<br>${sch}</div>
                    <img src="${img.lr}" class="logo-img" style="${!img.lr ? 'visibility:hidden' : ''}">
                </div>
                
                <div class="tag-ruang">RUANG ${s.Ruang || '01'}</div>

                <table class="data-table">
                    <tr><td class="label-col">No. Peserta</td><td>: ${s.NoPeserta || '-'}</td></tr>
                    <tr><td>Nama Peserta</td><td>: <b style="text-transform:uppercase">${s.Nama || '-'}</b></td></tr>
                    <tr><td>Tempat & Tgl. Lahir</td><td>: ${s.TTL || '-'}</td></tr>
                </table>

                <div class="bottom-container">
                    <div class="photo-box">PAS FOTO 3X4</div>
                    
                    <div class="footer-section">
                        <div style="font-size:9px; margin-bottom:2px">Lingga Pura, 18 Mei 2026<br>Kepala Sekolah,</div>
                        <div class="sign-area">
                            ${img.s ? `<img src="${img.s}" class="img-s">` : ''}
                            ${img.t ? `<img src="${img.t}" class="img-t">` : ''}
                        </div>
                        <div class="ks-name">${ks}</div>
                        <div class="ks-nip">${nip}</div>
                    </div>
                </div>
                
                <div class="note-text">Kartu ini wajib dibawa siswa selama ujian berlangsung</div>
            `;
            area.appendChild(div);
        });
    }
</script>
</body>
</html>
